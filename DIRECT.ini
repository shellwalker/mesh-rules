# ====================================================================
# 个人虚拟组网与局域网高优先级直连规则集 (Shadowrocket / Clash 引用专用)
# 适用场景：解决 Tailscale / ZeroTier 与代理软件并存时的打洞冲突与路由重叠
# ====================================================================

# --------------------------------------------------------------------
# 1. 域名直连规则 (最高优先级，防止控制流走代理导致打洞失败)
# --------------------------------------------------------------------
# 指定外部域名直接访问
DOMAIN-SUFFIX,medway.cloud,DIRECT

# 放行 Tailscale 核心寻址与控制平面域名
DOMAIN-SUFFIX,tailscale.com,DIRECT
DOMAIN-SUFFIX,tailscale.net,DIRECT
DOMAIN-KEYWORD,tailscale,DIRECT

# 放行 ZeroTier 寻址与根服务器域名
DOMAIN-SUFFIX,zerotier.com,DIRECT
DOMAIN-SUFFIX,zerotier.net,DIRECT

# 放行 模型 服务相关域名
DOMAIN-SUFFIX,minimax.com,DIRECT

# 放行 常规本地局域网寻址域名
DOMAIN-SUFFIX,local,DIRECT
DOMAIN-KEYWORD,lan,DIRECT

# --------------------------------------------------------------------
# 2. IP 路由直连规则 (带 no-resolve，无条件将数据包丢给系统原生网卡)
# --------------------------------------------------------------------
# 指定外部 IP 地址直接访问
IP-CIDR,104.128.88.172/32,DIRECT,no-resolve
IP-CIDR,89.208.241.152/32,DIRECT,no-resolve

# 强制直连 ZeroTier 指定子网段
IP-CIDR,10.16.21.0/24,DIRECT,no-resolve

# 强制直连 Tailscale 核心虚拟网段
IP-CIDR,100.64.0.0/10,DIRECT,no-resolve

# 强制直连 常规 RFC1918 私有局域网网段（防止代理软件全局抢道）
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve

# 强制直连 本地回环与链路本地地址
IP-CIDR,127.0.0.1/32,DIRECT,no-resolve
IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
